[project]
name = "aprsx"
version = "0.1.0"
description = "Raspberry Pi mobile APRS appliance: touch-screen radio head + web UI on top of Direwolf"
requires-python = ">=3.11"
dependencies = [
    "aprslib>=0.7.2",
    "fastapi>=0.110",
    "pydantic>=2.6",
    "uvicorn>=0.29",
    "websockets>=12",  # uvicorn needs a WebSocket implementation for /ws
]

[project.optional-dependencies]
# Touch-screen head unit (phase 4+)
head = ["PySide6>=6.5"]

[project.scripts]
aprsx-core = "aprsx.core.__main__:main"
aprsx-monitor = "aprsx.core.monitor:main"

[dependency-groups]
dev = ["httpx>=0.27", "pytest>=8", "pytest-asyncio>=0.23"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["aprsx"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
