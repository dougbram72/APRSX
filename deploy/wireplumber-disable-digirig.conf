# Keep PipeWire/WirePlumber away from the Digirig's C-Media sound card so
# Direwolf can open it directly via ALSA (otherwise: "Device or resource busy").
# Install to: ~/.config/wireplumber/wireplumber.conf.d/51-disable-digirig.conf
# then: systemctl --user restart wireplumber
monitor.alsa.rules = [
  {
    matches = [
      { device.name = "~alsa_card.usb-C-Media_Electronics_Inc._USB_Audio_Device*" }
    ]
    actions = {
      update-props = {
        device.disabled = true
      }
    }
  }
]
