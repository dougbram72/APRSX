# Starter Direwolf config for a Digirig. Phase 6 will generate this from the
# web settings; until then, edit by hand and run: direwolf -c deploy/direwolf.conf
#
# Find the audio card name with `arecord -l`. The Digirig's CM108 codec
# usually appears as "Device".
ADEVICE plughw:CARD=Device,DEV=0
ACHANNELS 1

CHANNEL 0
MYCALL N0CALL-9
MODEM 1200

# Digirig keys PTT with RTS on its CP2102 serial port.
PTT /dev/ttyUSB0 RTS

# aprsx-core talks to Direwolf only through KISS TCP.
KISSPORT 8001
AGWPORT 0

# Fill-in digipeater (WIDE1-1 only). Uncomment to enable.
# DIGIPEAT 0 0 ^WIDE1-1$ ^WIDE1-1$
